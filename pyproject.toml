[project]
name = "spreadsheet-ai"
version = "0.1.0"
description = "Secure collaborative-style spreadsheet editor with Sign in with Google and encrypted SQLite storage"
readme = "README.md"
authors = [
    { name = "Bogdan", email = "github.34373732@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anyio>=4.15.1",
    "fastapi>=0.142.2",
    "cryptography>=46.0.0",
    "uvicorn>=0.38.0",
]

[dependency-groups]
dev = [
    "pytest-anyio>=0.0.0",
    "pytest>=9.1.1",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
pythonpath = ["backend/src"]
testpaths = ["backend/tests"]
